name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  APP_NAME: dmaas-api
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 src tests

      - name: black --check
        run: black --check src tests

      - name: isort --check-only
        run: isort --check-only src tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # --- These four steps are written against real tools/actions and will run
  # for real as soon as the matching repo secrets exist. Until then GitHub
  # Actions will fail the job at the auth step with a clear "invalid
  # credentials" error rather than silently no-opping — that's intentional:
  # it tells you exactly which secret is still missing. Required secrets are
  # listed above each job.

  nexus-iq:
    name: Nexus IQ (dependency/OSS scan)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Required secrets: NEXUS_IQ_SERVER_URL, NEXUS_IQ_USERNAME, NEXUS_IQ_PASSWORD
    # Required var:     NEXUS_IQ_APPLICATION_ID
    steps:
      - uses: actions/checkout@v4

      - name: Run Nexus IQ scan
        uses: sonatype-nexus-community/iq-github-action@v2
        with:
          serverUrl: ${{ secrets.NEXUS_IQ_SERVER_URL }}
          username: ${{ secrets.NEXUS_IQ_USERNAME }}
          password: ${{ secrets.NEXUS_IQ_PASSWORD }}
          application: ${{ vars.NEXUS_IQ_APPLICATION_ID }}
          stage: build
          target: "."

  polaris-sast:
    name: Polaris SAST
    runs-on: ubuntu-latest
    needs: unit-tests
    # Required secrets: POLARIS_SERVER_URL, POLARIS_ACCESS_TOKEN
    # Required var:     POLARIS_APPLICATION_NAME, POLARIS_PROJECT_NAME
    steps:
      - uses: actions/checkout@v4

      - name: Run Polaris scan
        uses: synopsys-sig/synopsys-action@v2
        with:
          polaris_server_url: ${{ secrets.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_application_name: ${{ vars.POLARIS_APPLICATION_NAME }}
          polaris_project_name: ${{ vars.POLARIS_PROJECT_NAME }}
          polaris_assessment_types: "SAST"

  prisma-iac-scan:
    name: Prisma Cloud IaC Scan (Checkov)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Optional secret: PRISMA_CLOUD_API_TOKEN (full Prisma Cloud platform
    # integration + dashboard reporting; omit to run Checkov open-source only)
    steps:
      - uses: actions/checkout@v4

      - name: Run Prisma Cloud IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: "."
          framework: terraform,dockerfile,secrets
          api-key: ${{ secrets.PRISMA_CLOUD_API_TOKEN }}
          soft_fail: true   # flip to false once the team wants failing builds on findings

  build:
    name: Build (Docker image from Dockerfile)
    runs-on: ubuntu-latest
    needs: [nexus-iq, polaris-sast, prisma-iac-scan]
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHORT_SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image from Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.APP_NAME }}:${{ steps.vars.outputs.image_tag }}
          push: false
          load: false
          outputs: type=docker,dest=image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  sbom:
    name: SBOM (Syft — real, runs today)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: "${{ env.APP_NAME }}:${{ needs.build.outputs.image_tag }}"
          format: cyclonedx-json
          output-file: sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container-scan:
    name: Container Scan (Trivy — real, runs today; swap for Twistlock later)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.APP_NAME }}:${{ needs.build.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # set to "1" once the team wants failing builds on findings

  twistlock-scan:
    name: Twistlock / Prisma Cloud Compute Image Scan
    runs-on: ubuntu-latest
    needs: build
    # Required secrets: PRISMA_COMPUTE_CONSOLE_URL, PRISMA_COMPUTE_USER, PRISMA_COMPUTE_PASSWORD
    # (Console URL is your Prisma Cloud Compute console, e.g. https://<console>.twistlock.com)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar

      - name: Download twistcli from the Console
        run: |
          curl -k -u "${{ secrets.PRISMA_COMPUTE_USER }}:${{ secrets.PRISMA_COMPUTE_PASSWORD }}" \
            --output twistcli \
            "${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}/api/v1/util/twistcli"
          chmod +x twistcli

      - name: Run Twistlock image scan
        run: |
          ./twistcli images scan \
            --address "${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}" \
            --user "${{ secrets.PRISMA_COMPUTE_USER }}" \
            --password "${{ secrets.PRISMA_COMPUTE_PASSWORD }}" \
            --details \
            "${APP_NAME}:${{ needs.build.outputs.image_tag }}"

  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [sbom, container-scan, twistlock-scan]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Record build metadata
        run: |
          {
            echo "image_tag=${{ needs.build.outputs.image_tag }}"
            echo "git_sha=${{ github.sha }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> build-metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build-metadata.txt

      # Push-to-ECR steps go here once ECR_REPOSITORY and an AWS IAM role ARN
      # are confirmed, e.g.:
      #
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      # - run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY }}
      # - run: |
      #     docker load -i image.tar
      #     docker tag ${{ env.APP_NAME }}:${{ needs.build.outputs.image_tag }} ${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}
      #     docker push ${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}
      #
      # Until then, the immutable image + SBOM produced above are the
      # promotable artifacts, downloadable from this run's Actions artifacts.
